name: Disney Dining Bot Poll

on:
  workflow_dispatch:

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Explain worker deployment
        run: |
          echo "Production polling now runs on the VPS Playwright worker."
          echo "GitHub Actions cannot maintain the persistent Disney browser session."

      - name: Validate Python imports
        env:
          GITHUB_GIST_ID: ${{ secrets.GH_GIST_ID }}
          GITHUB_TOKEN: ${{ secrets.GIST_TOKEN }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM: ${{ secrets.TWILIO_FROM }}
          TWILIO_TO: ${{ secrets.TWILIO_TO }}
        run: python -m py_compile disney_bot.py monitor.py notify.py storage.py update_calendar_cache.py watch_store.py seed_disney_session.py
