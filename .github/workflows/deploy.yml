name: Deploy to Netlify

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Connect this GitHub repo to Netlify CI (idempotent).
      # Netlify CI natively supports Python functions; the Deploy API does not.
      # After the first successful connection, Netlify will auto-build on every push via webhook.
      - name: Link GitHub repo to Netlify CI
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          GH_DEPLOY_PAT: ${{ secrets.GH_DEPLOY_PAT }}
        run: |
          set -e
          echo "Linking repo to Netlify CI..."
          RESP=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X PATCH \
            -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.netlify.com/api/v1/sites/b1f7efc5-da94-4159-ade0-568de33ed24f" \
            -d "{
              \"repo\": {
                \"provider\": \"github\",
                \"repo\": \"44isthenumber/disney-dining-bot\",
                \"branch\": \"main\",
                \"private\": true,
                \"cmd\": \"echo no-build\",
                \"dir\": \"public\",
                \"functions_dir\": \"netlify/functions\",
                \"allowed_branches\": [\"main\"],
                \"access_token\": \"$GH_DEPLOY_PAT\"
              }
            }")
          STATUS=$(echo "$RESP" | grep HTTP_STATUS | cut -d: -f2)
          BODY=$(echo "$RESP" | grep -v HTTP_STATUS)
          echo "Status: $STATUS"
          echo "$BODY" | python3 -c "import sys,json; d=json.load(sys.stdin); print('repo:', d.get('repo',{}).get('repo','(none)')); print('build_settings:', d.get('build_settings',{}))" 2>/dev/null || echo "$BODY" | head -5

      # Trigger Netlify CI build directly (requires connected repo from step above)
      - name: Trigger Netlify CI build
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          set -e
          echo "Triggering Netlify build..."
          RESP=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST \
            -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" \
            "https://api.netlify.com/api/v1/sites/b1f7efc5-da94-4159-ade0-568de33ed24f/builds")
          STATUS=$(echo "$RESP" | grep HTTP_STATUS | cut -d: -f2)
          BODY=$(echo "$RESP" | grep -v HTTP_STATUS)
          echo "Status: $STATUS"
          echo "$BODY" | python3 -c "import sys,json; d=json.load(sys.stdin); print('build id:', d.get('id')); print('state:', d.get('state')); print('error:', d.get('error',''))" 2>/dev/null || echo "$BODY" | head -5
