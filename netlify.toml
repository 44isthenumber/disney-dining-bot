[build]
  command = "echo 'no build step — static SPA + pre-built functions'"
  publish = "public"

[functions]
  directory = "netlify/functions"
  included_files = [
    "auth.py",
    "storage.py",
    "app.py",
    "public/restaurants.json",
  ]

[[redirects]]
  from = "/_api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# SPA fallback — any unmatched path serves index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
