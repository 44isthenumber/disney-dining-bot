[build]
  command = "cp public/restaurants.json netlify/functions/ && cd netlify/functions && npm install"
  publish = "public"

[functions]
  directory = "netlify/functions"

# Pin crawler MIME. There is no /* → index.html splat, so missing
# files 404 (public/404.html on Netlify) instead of soft-200ing home.
[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"

[[headers]]
  for = "/sitemap_index.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"

[[redirects]]
  from = "/_api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# Pretty legal URLs. No /* → index.html splat: unknown paths must 404,
# not soft-200 the homepage. The signed-in app is `/` plus hash/query only.
[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/terms"
  to = "/terms.html"
  status = 200

[[redirects]]
  from = "/sms-consent"
  to = "/sms-consent.html"
  status = 200

[[redirects]]
  from = "/text-consent"
  to = "/sms-consent"
  status = 301

[[redirects]]
  from = "/text-consent.html"
  to = "/sms-consent"
  status = 301

# Pretty money-page URLs. Real HTML files — not a homepage splat.
[[redirects]]
  from = "/alerts/space-220"
  to = "/alerts/space-220.html"
  status = 200

[[redirects]]
  from = "/alerts/ohana"
  to = "/alerts/ohana.html"
  status = 200

[[redirects]]
  from = "/alerts/cinderellas-royal-table"
  to = "/alerts/cinderellas-royal-table.html"
  status = 200
