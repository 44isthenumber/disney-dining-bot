<!-- Block 2: Restaurant browser — paste into a Carrd "Embed" element -->
<!-- Requires Block 1 (apiFetch, getApiBase) to be on the same page -->
<style>
  #dd-browser {
    font-family: system-ui, -apple-system, sans-serif;
    color: #222;
    max-width: 960px;
    margin: 0 auto;
  }
  #dd-filters {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 16px;
    align-items: center;
  }
  #dd-filters input, #dd-filters select {
    padding: 7px 12px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 14px;
  }
  #dd-search { flex: 1; min-width: 180px; }
  #dd-party-size { width: 120px; }
  #dd-results-count { color: #888; font-size: 13px; margin-left: auto; }

  #dd-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 16px;
  }
  .dd-card {
    border: 1px solid #e0e0e0;
    border-radius: 10px;
    overflow: hidden;
    cursor: pointer;
    transition: box-shadow .15s, transform .15s;
    background: #fff;
    position: relative;
  }
  .dd-card:hover { box-shadow: 0 4px 16px rgba(0,0,0,.12); transform: translateY(-2px); }
  .dd-card img {
    width: 100%; height: 130px;
    object-fit: cover;
    background: #f0f0f0;
    display: block;
  }
  .dd-card-body { padding: 10px 12px; }
  .dd-card-name { font-weight: 600; font-size: 14px; line-height: 1.3; margin-bottom: 4px; }
  .dd-card-meta { font-size: 12px; color: #777; }
  .dd-card-badges { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  .dd-badge {
    font-size: 11px; padding: 2px 7px; border-radius: 20px;
    background: #e8f0fe; color: #1a56db;
  }
  .dd-badge.watch { background: #e3f9e5; color: #276749; }
  .dd-card-btn {
    display: block;
    width: calc(100% - 24px);
    margin: 8px 12px 12px;
    padding: 7px;
    background: #1a56db;
    color: #fff;
    border: none;
    border-radius: 6px;
    font-size: 13px;
    cursor: pointer;
    text-align: center;
  }
  .dd-card-btn:hover { background: #1245b8; }
  #dd-loading { text-align: center; color: #888; padding: 32px; }
  #dd-empty   { text-align: center; color: #aaa; padding: 32px; font-size: 14px; }
</style>

<div id="dd-browser">
  <div id="dd-filters">
    <input id="dd-search" type="search" placeholder="Search restaurants…" />
    <input id="dd-park-filter" type="text" placeholder="Park / Resort" style="width:160px" />
    <input id="dd-cuisine-filter" type="text" placeholder="Cuisine" style="width:120px" />
    <select id="dd-party-size">
      <option value="1">Party of 1</option>
      <option value="2" selected>Party of 2</option>
      <option value="3">Party of 3</option>
      <option value="4">Party of 4</option>
      <option value="5">Party of 5</option>
      <option value="6">Party of 6</option>
    </select>
    <span id="dd-results-count"></span>
  </div>
  <div id="dd-loading">Loading restaurants…</div>
  <div id="dd-grid" style="display:none"></div>
  <div id="dd-empty" style="display:none">No restaurants match your search.</div>
</div>

<script>
(function () {
  let allRestaurants = [];
  let debounceTimer = null;

  const grid    = document.getElementById('dd-grid');
  const loading = document.getElementById('dd-loading');
  const empty   = document.getElementById('dd-empty');
  const count   = document.getElementById('dd-results-count');

  function partySize() {
    return parseInt(document.getElementById('dd-party-size').value, 10) || 2;
  }

  async function loadRestaurants() {
    try {
      const data = await apiFetch('/restaurants');
      allRestaurants = data.restaurants || [];
      renderGrid(allRestaurants);
    } catch (e) {
      loading.textContent = 'Failed to load: ' + e.message;
    }
  }

  function renderGrid(list) {
    loading.style.display = 'none';
    if (!list.length) {
      grid.style.display = 'none';
      empty.style.display = 'block';
      count.textContent = '0 results';
      return;
    }
    empty.style.display = 'none';
    grid.style.display = 'grid';
    count.textContent = list.length + ' restaurant' + (list.length !== 1 ? 's' : '');
    grid.innerHTML = list.map(function (r) {
      const img = r.thumbnail_url
        ? '<img src="' + r.thumbnail_url + '" alt="" loading="lazy" />'
        : '<div style="height:130px;background:#f5f5f5;display:flex;align-items:center;justify-content:center;color:#ccc;font-size:12px">No image</div>';
      const watchCount = (r.watched_dates || []).length;
      const watchBadge = watchCount
        ? '<span class="dd-badge watch">Watching ' + watchCount + ' date' + (watchCount !== 1 ? 's' : '') + '</span>'
        : '';
      return '<div class="dd-card" data-id="' + r.facility_id + '">' +
        img +
        '<div class="dd-card-body">' +
          '<div class="dd-card-name">' + escHtml(r.name) + '</div>' +
          '<div class="dd-card-meta">' + escHtml(r.park || '') + (r.cuisine ? ' · ' + escHtml(r.cuisine) : '') + '</div>' +
          '<div class="dd-card-badges">' +
            (r.price_range ? '<span class="dd-badge">' + escHtml(r.price_range.split(' ')[0]) + '</span>' : '') +
            (r.experience_type ? '<span class="dd-badge">' + escHtml(r.experience_type) + '</span>' : '') +
            watchBadge +
          '</div>' +
        '</div>' +
        '<button class="dd-card-btn" data-id="' + r.facility_id + '" data-slug="' + escHtml(r.slug) + '" data-name="' + escHtml(r.name) + '">View Calendar</button>' +
      '</div>';
    }).join('');

    // Button click → open calendar modal
    grid.querySelectorAll('.dd-card-btn').forEach(function (btn) {
      btn.addEventListener('click', function (e) {
        e.stopPropagation();
        window.ddOpenCalendar(btn.dataset.id, btn.dataset.slug, btn.dataset.name, partySize());
      });
    });
  }

  function filterAndRender() {
    const q  = document.getElementById('dd-search').value.toLowerCase().trim();
    const pk = document.getElementById('dd-park-filter').value.toLowerCase().trim();
    const cu = document.getElementById('dd-cuisine-filter').value.toLowerCase().trim();
    const list = allRestaurants.filter(function (r) {
      return (!q  || r.name.toLowerCase().includes(q))
          && (!pk || r.park.toLowerCase().includes(pk))
          && (!cu || r.cuisine.toLowerCase().includes(cu));
    });
    renderGrid(list);
  }

  function escHtml(s) {
    return String(s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }

  ['dd-search','dd-park-filter','dd-cuisine-filter'].forEach(function (id) {
    document.getElementById(id).addEventListener('input', function () {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(filterAndRender, 280);
    });
  });

  // Re-render when party size changes (affects watched_party_size display)
  document.getElementById('dd-party-size').addEventListener('change', filterAndRender);

  // Expose refresh for use by other blocks after watch add/remove
  window.ddRefreshBrowser = function () {
    loadRestaurants();
  };

  // Load on ready — wait for apiFetch to be defined by Block 1
  function init() {
    if (typeof apiFetch === 'undefined') { setTimeout(init, 100); return; }
    if (getApiBase()) loadRestaurants();
  }
  init();
  window.addEventListener('dd-config-changed', loadRestaurants);
})();
</script>
