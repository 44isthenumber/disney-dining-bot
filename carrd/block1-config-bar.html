<!-- Block 1: Config bar + status — paste into a Carrd "Embed" element -->
<style>
  #dd-config {
    font-family: system-ui, -apple-system, sans-serif;
    background: #1a1a2e;
    color: #eee;
    padding: 12px 16px;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    border-radius: 8px;
    font-size: 13px;
  }
  #dd-config label { color: #aaa; margin-right: 2px; }
  #dd-config input[type=text], #dd-config input[type=date] {
    background: #2a2a4e;
    border: 1px solid #555;
    color: #eee;
    padding: 4px 8px;
    border-radius: 4px;
    font-size: 13px;
    width: 220px;
  }
  #dd-config input[type=date] { width: 130px; }
  #dd-status {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-left: auto;
    font-size: 12px;
  }
  #dd-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: #888;
    flex-shrink: 0;
  }
  #dd-dot.ok   { background: #4caf50; }
  #dd-dot.warn { background: #ff9800; }
  #dd-dot.err  { background: #f44336; }
  #dd-status-text { color: #ccc; }
</style>

<div id="dd-config">
  <div>
    <label>API URL</label>
    <input id="dd-api-base" type="text" placeholder="https://xxxx.ngrok-free.app"
           oninput="localStorage.setItem('disneyApiBase', this.value)" />
  </div>
  <div>
    <label>Secret</label>
    <input id="dd-api-secret" type="text" placeholder="disney-bot-dev"
           oninput="localStorage.setItem('disneyApiSecret', this.value)" />
  </div>
  <div>
    <label>Trip</label>
    <input id="dd-trip-start" type="date"
           oninput="localStorage.setItem('disneyTripStart', this.value); window.dispatchEvent(new Event('dd-config-changed'))" />
    <span style="margin:0 4px;color:#888">–</span>
    <input id="dd-trip-end" type="date"
           oninput="localStorage.setItem('disneyTripEnd', this.value); window.dispatchEvent(new Event('dd-config-changed'))" />
  </div>
  <div id="dd-status">
    <div id="dd-dot"></div>
    <span id="dd-status-text">Connecting…</span>
  </div>
</div>

<script>
(function () {
  // Restore saved values
  ['disneyApiBase','disneyApiSecret','disneyTripStart','disneyTripEnd'].forEach(function (k) {
    const el = document.getElementById({
      disneyApiBase:   'dd-api-base',
      disneyApiSecret: 'dd-api-secret',
      disneyTripStart: 'dd-trip-start',
      disneyTripEnd:   'dd-trip-end',
    }[k]);
    if (el) el.value = localStorage.getItem(k) || '';
  });

  window.getApiBase = function () { return localStorage.getItem('disneyApiBase') || ''; };
  window.apiFetch = async function (path, opts) {
    opts = opts || {};
    const base = getApiBase();
    if (!base) throw new Error('API URL not set');
    const res = await fetch(base + path, Object.assign({}, opts, {
      headers: Object.assign({
        'Content-Type': 'application/json',
        'X-API-Secret': localStorage.getItem('disneyApiSecret') || '',
      }, opts.headers || {}),
    }));
    if (!res.ok) throw new Error(res.status + ' ' + res.statusText);
    return res.status === 204 ? null : res.json();
  };

  async function refreshStatus() {
    const dot  = document.getElementById('dd-dot');
    const text = document.getElementById('dd-status-text');
    if (!getApiBase()) {
      dot.className = ''; text.textContent = 'Set API URL above';
      return;
    }
    try {
      const s = await apiFetch('/status');
      const min = s.token_expires_in_minutes;
      if (s.token_status === 'ok' && min > 0) {
        dot.className = min < 60 ? 'warn' : 'ok';
        const pollStr = s.last_poll_at
          ? ' · polled ' + new Date(s.last_poll_at).toLocaleTimeString()
          : '';
        text.textContent = 'Token ~' + min + 'm · ' + s.watches_count + ' watches' + pollStr;
      } else {
        dot.className = 'err';
        text.textContent = 'Token ' + s.token_status;
      }
    } catch (e) {
      dot.className = 'err';
      text.textContent = 'Error: ' + e.message;
    }
  }

  refreshStatus();
  setInterval(refreshStatus, 60000);
  document.getElementById('dd-api-base').addEventListener('change', refreshStatus);
  document.getElementById('dd-api-secret').addEventListener('change', refreshStatus);
})();
</script>
